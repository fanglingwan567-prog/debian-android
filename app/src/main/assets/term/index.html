<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="xterm.css"><style>
/* Use the WebView viewport: the root element can have zero height even after native layout. */
html,body,#term{margin:0;overflow:hidden}
body{position:fixed;inset:0;background:#151a17}
#term{height:100%;touch-action:none}
#term .xterm-helper-textarea{pointer-events:none}
/* Scale the track itself so hit testing and painting share the same horizontal bounds. */
#term .xterm-scrollable-element > .scrollbar.vertical{transform:scaleX(.7);transform-origin:center}
/* Touchscreens have no hover to reveal xterm's auto-hidden history track. */
#term.has-scrollback .xterm-scrollable-element > .scrollbar.vertical.invisible{opacity:1;pointer-events:auto;z-index:11}
#selection-stems{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
#selection-stems path{fill:none;stroke:#abe9bd;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.grip{position:fixed;z-index:22;width:52px;height:52px;transform:translate(-50%,-50%);padding:0;border:0;background:none;touch-action:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.grip::after{content:"";position:absolute;left:50%;top:50%;box-sizing:border-box;width:22px;height:22px;transform:translate(-50%,-50%) rotate(var(--angle));border-radius:2px 55% 55%;background:#abe9bd;border:1.5px solid #203c29;box-shadow:0 0 0 1px #abe9bd;pointer-events:none}
.grip[data-dragging]::after,.grip:focus-visible::after{background:#e6ffed;box-shadow:0 0 0 2px #abe9bd}
</style></head><body><div id="term"></div><svg id="selection-stems" aria-hidden="true"><path id="start-stem"/><path id="end-stem"/></svg><button type="button" id="start-grip" class="grip" aria-label="调整选区起点" hidden></button><button type="button" id="end-grip" class="grip" aria-label="调整选区终点" hidden></button><script src="xterm.js"></script><script src="fit.js"></script><script src="screen.js"></script></body></html>
